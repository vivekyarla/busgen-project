id: nvda-crwv-series-b-2023

verdict: circular
circularity_score: 90

principals_involved: [huang, intrator]

rubric:
  real_economic_demand:
    score: 2
    note: >-
      CoreWeave had real demand to serve — Microsoft signed a multi-
      billion contract two months after this round. The question is
      whether the demand existed independently of NVIDIA's seeding.
  arms_length_pricing:
    score: 1
    note: >-
      Series B at Magnetar-led terms, but NVIDIA's check size was
      undisclosed. The investor and the sole supplier are the same
      entity; pricing reflects whatever NVIDIA wanted to commit.
  cash_vs_equity_clarity:
    score: 2
    note: >-
      Cash investment, disclosed at the round level. Clean compared to
      the warrant-grant structures of later deals.
  counterparty_independence:
    score: 0
    note: >-
      NVIDIA invested in a company whose entire cost structure is
      buying NVIDIA chips. Every dollar of equity becomes a dollar of
      future NVIDIA revenue, plus a return on the equity.
  third_party_verification:
    score: 2
    note: >-
      Round announced via standard BusinessWire press release. Later
      CoreWeave S-1 disclosures fill in the picture.

incentive_map: |
  **NVIDIA's side.** Seeding a customer that will spend its capital on
  NVIDIA GPUs is a way to convert balance-sheet cash into recognized
  revenue with one degree of separation. The equity stake captures the
  upside; the chip sales capture the income statement.

  **CoreWeave's side.** Capital plus implicit GPU allocation priority
  during the worst supply shortage in the industry's history. This was
  the prize. The shortage was the moat; NVIDIA controlled the moat;
  NVIDIA shared the moat with its equity holdings.

  **The hidden flow.** CoreWeave's H100 fleet, financed in part by
  NVIDIA's investment, becomes the substrate for the Microsoft–OpenAI
  training infrastructure. NVIDIA captures three layers of margin:
  the chip sale, the equity appreciation, and the strategic optionality
  on neocloud allocations.

circularity_notes: |
  This is the seed crystal of the 2023–2026 circular pattern. Every
  subsequent neocloud equity arrangement (Lambda, Nebius, Nscale) is a
  variation on this template. The deal is small in dollars
  ($221M total, NVIDIA's share unknown) but precedential in structure.

illustration_tone: satirical
illustration_prompt: >-
  Hephaestus (Huang) at his forge, handing Charon (Intrator) a sack of
  drachmae. Charon turns around and hands the same drachmae back to
  Hephaestus across a different counter, this one marked "GPUs." Two
  ledgers. A small smiling Hermes observes from a column.
