id: tsmc-apple-n3-2023

verdict: buildout
circularity_score: 8

principals_involved: []

rubric:
  real_economic_demand:
    score: 3
    note: >-
      Apple ships hundreds of millions of devices a year, each
      requiring a real chip. The N3 wafer commitment is sized to
      shipped product, not press releases.
  arms_length_pricing:
    score: 3
    note: >-
      Negotiated wafer pricing with documented terms (Apple absorbs no
      defective-die cost). Apple is the largest customer; terms reflect
      that leverage, but they are commercial terms between distinct
      firms.
  cash_vs_equity_clarity:
    score: 3
    note: >-
      Cash for wafers. No equity entanglement, no convertibles, no
      warrants.
  counterparty_independence:
    score: 3
    note: >-
      Apple is not a TSMC shareholder of record; TSMC is not an Apple
      shareholder. The companies are independent.
  third_party_verification:
    score: 3
    note: >-
      Both firms file regular public disclosures. Revenue
      concentration is reported in TSMC's 10-K equivalents; capex is
      reported in Apple's.

incentive_map: |
  **TSMC's side.** Anchor customer that underwrites the cost of every
  new-node ramp. The reason TSMC can build a leading-edge fab at all.

  **Apple's side.** Process leadership for its consumer silicon, plus
  defect-cost protection during the ramp. Pays a premium; gets a
  contractual advantage no competitor matches.

  **The flow.** Cash one direction, wafers the other. Both companies
  recognize the transaction the same way the IRS would.

circularity_notes: |
  Included in the catalog as a control case. Apple–TSMC is what an
  arms-length, industrially substantive AI-era-adjacent deal looks
  like. No warrants, no compute credits, no shared shareholders. The
  comparison sharpens the rest of the dataset.

illustration_tone: flattering
illustration_prompt: >-
  Hephaestus at his forge handing a finished blade to a merchant
  king, who pays in proper coin. Both parties bow politely. No tricks,
  no secret ledgers. A classical scene without satire.
