# Analysis overlay template.
#
# Copy this file to analysis/<deal-id>.yml — where <deal-id> matches the `id`
# of a deal in data/source/deals/. The join layer (src/lib/deals.ts) will
# merge this with the source deal data at build time.
#
# Every field below is OPTIONAL. A deal without an analysis file shows up on
# the site as "pending verdict". Add fields incrementally.

# Must match the source deal's id exactly.
id: example-deal-id

# One of: buildout | circular | mixed | pending
# - buildout:  real industrial purchase, arms-length, both parties independent
# - circular:  same dollars on both sides of the ledger, or interlocked equity
# - mixed:     genuine demand but with circular elements
# - pending:   not yet analyzed (default if file absent)
verdict: pending

# 0–100. Higher = more circular. Heuristic, not algorithmic.
circularity_score: null

# Which principals are actually behind this deal (slugs from principals.yml).
# The dataset is company-level; this is where we re-personalize.
principals_involved: []

# Sustainability rubric — score each 0–3.
#   0 = absent / opaque, 1 = weak, 2 = adequate, 3 = strong
rubric:
  real_economic_demand:        # Non-investor revenue justifying the purchase?
    score: null
    note: ""
  arms_length_pricing:         # Market-set price, or negotiating-with-yourself?
    score: null
    note: ""
  cash_vs_equity_clarity:      # Cash, equity, in-kind, or murky hybrid?
    score: null
    note: ""
  counterparty_independence:   # Are the parties financially distinct?
    score: null
    note: ""
  third_party_verification:    # Public terms, audited, or press-release-grade?
    score: null
    note: ""

# Free-form analytical prose. This is the meat. Markdown allowed.
incentive_map: |
  Who benefits, what's the hidden flow, who's on both sides.

circularity_notes: |
  The specific mechanism by which dollars (or compute, or equity) loop.

# flattering | satirical | neutral
# Drives the illustration register per the project's dual mode.
illustration_tone: neutral

# Prompt seed for the eventual image. Leave for later.
illustration_prompt: ""
