id: crusoe-orcl-abilene

verdict: mixed
circularity_score: 55

principals_involved: [ellison, altman, son]

rubric:
  real_economic_demand:
    score: 3
    note: >-
      The Abilene site is a physical 1.2GW data-center campus under
      construction. Steel, concrete, transmission interconnects, jobs.
      Whatever you think of the financing, the buildout exists.
  arms_length_pricing:
    score: 2
    note: >-
      Crusoe–Blue Owl JV terms are commercially disclosed; Oracle's
      lease and the OpenAI sublease have published cost ranges.
      Cleaner than the deals among the labs.
  cash_vs_equity_clarity:
    score: 2
    note: >-
      Project financing is debt + JV equity; Oracle's lease is a
      multi-year cash commitment. Less fuzzy than equity-for-compute
      structures, though the total $15B by 2025 figure absorbs many
      separate instruments.
  counterparty_independence:
    score: 1
    note: >-
      The chain Crusoe → Oracle → OpenAI → (back to NVIDIA via chip
      purchases) is the Stargate spine. Each link is its own party,
      but the cycle closes through the OpenAI–NVIDIA–Oracle triangle
      announced separately.
  third_party_verification:
    score: 2
    note: >-
      Construction is verifiable on the ground. Financing layers are
      disclosed in press releases and bond documents but no single
      audit covers the full chain.

incentive_map: |
  **Crusoe's side.** Earns a build-and-lease fee; converts a flared-
  gas crypto-mining business into a hyperscale data-center developer.
  Real margin on real construction.

  **Oracle's side.** Cronus (Ellison) returns to the hyperscaler
  contest by leasing capacity rather than building it. Re-rates
  Oracle as an AI infrastructure player at modest direct capex.

  **OpenAI's side.** Compute capacity outside Microsoft's exclusive
  arrangement. Strategic optionality that is itself the deal's
  value, separate from the megawatts.

  **The wider chain.** OpenAI's separately announced commitments to
  buy NVIDIA chips that will sit in Crusoe's racks under Oracle's
  contract close the circle. None of the individual contracts are
  obviously circular; the chain of them is.

circularity_notes: |
  Mixed because the physical substance is undeniable and the
  individual contracts are arms-length, but the *chain* is exactly
  the structure the thesis flags: A finances B who hires C who buys
  from D who invests in A. Each link defensible; the loop, less so.

illustration_tone: neutral
illustration_prompt: >-
  An aerial view of a Greek city under construction in the desert.
  Columns rise; workers carry stone. In a pavilion off to the side,
  Cronus (Ellison), Hermes (Altman), and Dionysus (Son) sign scrolls
  whose ink lines connect into a closed loop visible only from above.
