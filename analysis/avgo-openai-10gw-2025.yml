id: avgo-openai-10gw-2025

verdict: mixed
circularity_score: 45

principals_involved: [altman]

rubric:
  real_economic_demand:
    score: 2
    note: >-
      Custom-ASIC design is a substantive engineering program. Broadcom
      has a track record (Google TPU, Meta MTIA). OpenAI has the model
      workload to motivate custom silicon.
  arms_length_pricing:
    score: 2
    note: >-
      Broadcom is a chip-design partner, not an equity investor in
      OpenAI. The relationship is closer to standard ASIC engagement
      pricing than to the warrant-grant structures elsewhere.
  cash_vs_equity_clarity:
    score: 2
    note: >-
      The reported $10B order is a chip purchase, not bundled equity.
      Cleaner instrument than AMD–OpenAI or Microsoft–OpenAI.
  counterparty_independence:
    score: 3
    note: >-
      Broadcom and OpenAI are independent firms with no disclosed
      cross-shareholdings. Among the dataset's largest deals, this is
      the rare one without an obvious equity entanglement.
  third_party_verification:
    score: 1
    note: >-
      The $10B figure was disclosed by Broadcom (anonymously) before
      being publicly linked to OpenAI; the 10GW capacity figure is the
      press-release number. Deployment runs through 2029, well past
      the verification horizon.

incentive_map: |
  **Broadcom's side.** Adds OpenAI to its custom-ASIC roster
  (Google, Meta, Apple, now OpenAI). Recurring high-margin design and
  manufacturing revenue. The legitimacy gain is real: this is the
  business Broadcom is actually in.

  **OpenAI's side.** Optionality against NVIDIA at the chip level.
  Whether the chips ship at scale or not, the announcement reduces
  perceived NVIDIA dependence — which is itself worth the
  engagement.

  **The 10GW figure.** Like the AMD 6GW number, the gigawatt figure
  is best read as a strategic press number rather than a deployment
  forecast. OpenAI's total committed compute across deals now exceeds
  global available power in some forecasts.

circularity_notes: |
  Mixed rather than buildout because the substance (custom silicon
  engineering) is real but the *scale claim* (10GW by 2029) is
  underwritten by the same OpenAI revenue base that simultaneously
  supports announced commitments to NVIDIA, AMD, Oracle, CoreWeave,
  and Microsoft. The deals individually are credible; the sum is not.

illustration_tone: neutral
illustration_prompt: >-
  Hermes (Altman) at a workbench with a craftsman in plainer robes
  (Broadcom — perhaps depicted as a senior journeyman in Hephaestus's
  guild). They discuss a blueprint. The scene is honest work. In a
  pile behind them, six other blueprints labeled with different
  chipmakers' names sit half-rolled, mostly forgotten.
