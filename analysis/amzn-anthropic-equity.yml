id: amzn-anthropic-equity

verdict: circular
circularity_score: 85

principals_involved: [amodei, jassy]

rubric:
  real_economic_demand:
    score: 2
    note: >-
      Anthropic has real model demand and real enterprise customers via
      Claude. Compute consumption is genuine. The question is whether
      the *magnitude* of the spend is set by market need or by the
      equity round it is paired with.

  arms_length_pricing:
    score: 1
    note: >-
      No disclosed market-comparable for the AWS / Trainium pricing
      Anthropic gets. Price discovery happens inside the same room as
      the equity term sheet. Classic non-arms-length structure.

  cash_vs_equity_clarity:
    score: 2
    note: >-
      The $8B figure is cumulative across tranches and includes
      convertible notes. Amazon's reported stake is $60.6B (Feb 2026),
      which implies massive markups between tranches that the press
      releases do not reconcile to specific compute commitments.

  counterparty_independence:
    score: 0
    note: >-
      Amazon is simultaneously Anthropic's largest investor, its primary
      cloud provider, and the supplier of its custom training silicon
      (Trainium). The "customer" and "supplier" and "investor" roles
      collapse into one counterparty.

  third_party_verification:
    score: 1
    note: >-
      Equity figures appear in Amazon 10-Q filings, so the investment
      side is verifiable. Compute commitments are press-release-grade —
      no public contracts, no third-party audit of the GW or dollar
      figures Anthropic has committed to spend.

principals_involved_note: >-
  Plutus (Jassy) writes the check; Apollo (Amodei) preaches restraint
  while cashing it. The Apollonian register does not survive the
  encounter with the underlying flow of funds.

incentive_map: |
  **Amazon's side.** Equity investment buys two things: (1) a financial
  stake in a frontier lab at a steep markup, and (2) a captive customer
  for AWS / Trainium revenue. The second is arguably the larger prize —
  it props up AWS AI-segment growth that the market is pricing.

  **Anthropic's side.** Capital to compete in the compute arms race,
  plus a customer-of-last-resort for Claude (Amazon Bedrock
  distribution). The cost is dependence on a single cloud and silicon
  partner whose chips are not the industry standard.

  **The hidden flow.** Dollars cycle: Amazon → Anthropic (equity)
  → Amazon (compute revenue, denominated in part as Trainium
  capacity Anthropic might not have chosen on merit). Amazon books the
  return both as Anthropic equity appreciation *and* as AWS AI
  revenue. The same dollar funds two reported line items.

circularity_notes: |
  This is the template circular deal of the 2024–2026 cycle. It
  matters not because it is uniquely bad — it isn't — but because it
  established the structural pattern other deals (Microsoft–OpenAI,
  Oracle–OpenAI, AMD–OpenAI with warrants) now follow.

  The defense is that the alternative for a capital-intensive lab is
  to die. The defense is true and also beside the point: structural
  patterns persist whether or not each participant has a good local
  reason for them.

illustration_tone: satirical

illustration_prompt: >-
  Plutus and Apollo in a Greco-Roman temple counting house. Plutus
  hands Apollo a sack of coins; Apollo passes it back across the
  table marked "AWS compute." A scribe behind a pillar records both
  transactions on separate ledgers. Light from above is theatrical
  but suspicious. Marble, ochre, lapis. Slightly absurd.
