# Principals — the recurring cast.
#
# Companies are pre-categorized in data/source/companies.yml (chip_designer,
# hyperscaler, ai_lab, neocloud, …). The dataset is company-level. Our thesis
# is that the *people* are the unit of analysis: the same ~12 figures recur as
# counterparties across deals. This file is the join from company to person.
#
# pantheon.god is the analytical claim, not a costume. Pick analogs whose
# domain does work: Hephaestus forges what every other god needs (Huang);
# Hermes is the messenger who moves between realms and makes the deals
# (Altman); Cronus is the old titan the younger generation tolerates and
# eventually displaces (Ellison).

- slug: altman
  name: Sam Altman
  role: CEO
  companies: [openai]
  pantheon:
    god: Hermes
    epithet: The Dealmaker
    note: >-
      Messenger between every realm. Investor, customer, supplier in the
      same week. The figure whose ubiquity *is* the circularity.

- slug: huang
  name: Jensen Huang
  role: Founder, CEO
  companies: [nvidia]
  pantheon:
    god: Hephaestus
    epithet: The Forge
    note: >-
      The smith every other god depends on. His leather jacket is the
      blacksmith's apron. Everyone — labs, hyperscalers, neoclouds —
      genuflects at the forge.

- slug: nadella
  name: Satya Nadella
  role: CEO
  companies: [microsoft]
  pantheon:
    god: Zeus
    epithet: Sky Father
    note: >-
      The dominant hyperscaler. Older establishment than the labs but
      reinvented through the OpenAI alliance. Holds the lightning of
      enterprise distribution.

- slug: amodei
  name: Dario Amodei
  role: Co-founder, CEO
  companies: [anthropic]
  pantheon:
    god: Apollo
    epithet: Temperance
    note: >-
      Prophet of measured AI. Constitutional methods, safety register.
      The pantheon's voice of restraint — which does not stop him from
      raising at the same valuations as the less restrained.

- slug: hassabis
  name: Demis Hassabis
  role: Co-founder, CEO
  companies: [google]
  pantheon:
    god: Athena
    epithet: Wisdom
    note: >-
      Research-first, chess-prodigy register. DeepMind's positioning
      inside Google: the strategist whose authority comes from
      intellectual legitimacy rather than market power.

- slug: musk
  name: Elon Musk
  role: Founder, CEO
  companies: [xai, tesla]
  pantheon:
    god: Ares
    epithet: War
    note: >-
      Picks fights with every other principal. Builds Colossus at speed
      that violates the others' decorum. Antagonist energy is the
      strategy.

- slug: ellison
  name: Larry Ellison
  role: Founder, Chairman
  companies: [oracle]
  pantheon:
    god: Cronus
    epithet: The Old Titan
    note: >-
      Predates the current pantheon. Hyperscaler-by-acquisition. The
      Stargate deal is his return from exile — the elder god re-entering
      the contest.

- slug: su
  name: Lisa Su
  role: CEO
  companies: [amd]
  pantheon:
    god: Artemis
    epithet: The Hunter
    note: >-
      Patient, strategic, gaining on Hephaestus's forge. Cousin to Huang
      in real life — the mythological parallel writes itself.

- slug: son
  name: Masayoshi Son
  role: Founder, CEO
  companies: [softbank]
  pantheon:
    god: Dionysus
    epithet: Excess
    note: >-
      Vision Fund era taught the pantheon what bacchanalian capital
      looks like. Stargate is the encore — bigger numbers, same vintage.

- slug: zuckerberg
  name: Mark Zuckerberg
  role: Founder, CEO
  companies: [meta]
  pantheon:
    god: Hades
    epithet: The Separate Kingdom
    note: >-
      Builds his own underworld. Llama as the open-weights counter-court.
      Less in the deal-flow because he runs his own realm — but his
      capex line still feeds the same forges.

- slug: jassy
  name: Andy Jassy
  role: CEO
  companies: [amazon-aws]
  pantheon:
    god: Plutus
    epithet: Wealth
    note: >-
      Inherited the AWS money engine. The Anthropic relationship is the
      template circular deal — equity in, compute spend out, the same
      dollars on both sides of the ledger.

- slug: pichai
  name: Sundar Pichai
  role: CEO
  companies: [google]
  pantheon:
    god: Poseidon
    epithet: Co-Equal Sea-King
    note: >-
      Distinct empire from Zeus/Microsoft. TPU vertical integration is
      his trident — Google is the only major lab whose chips, cloud,
      and model are all under one roof.

- slug: intrator
  name: Michael Intrator
  role: Co-founder, CEO
  companies: [coreweave]
  pantheon:
    god: Charon
    epithet: The Ferryman
    note: >-
      Moves workloads across the compute river for a fee. Crypto-mining
      origin story; now ferries the labs' training jobs. Neocloud as
      psychopomp.
