# OUTPUT is for AI, per public signals — backlog, "sold out", book-to-bill, lead
# times. Multiplied into the bottleneck score for supply nodes (velocity × gap ×
# demand). Absent → DEFAULT_DEMAND (0.45). This is a first-pass LLM-assigned read
# grounded in 2025–26 filings/news; edit freely (see data/AGENTS.md). Excluded
# layers (application/capital/hyperscaler) are omitted — they don't score.

